title = "ppr gitleaks config"

# Start from gitleaks' maintained default ruleset and layer an allowlist
# on top for this repo's known false positives, per the Git Hooks RFC:
# https://github.com/bcgov/connect/discussions/23
[extend]
useDefault = true

[[rules]]
    id = "custom-password"
    description = "Hardcoded password assignment detected"
    regex = '''(?i)(?:password|passwd|pwd)[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|, )[\x60'"\s=]{0,5}(['"][^'"\s]{8,}['"]|[^\s'"]{8,})'''
    entropy = 2.5
    keywords = ["password", "passwd", "pwd"]

[allowlist]
description = "Files that routinely trip default rules with non-secret content"
paths = [
  '''pnpm-lock\.yaml''',
  '''package-lock\.json''',
  '''poetry\.lock''',
  '''\.gitleaks\.toml''',
]
