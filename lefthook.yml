# Lefthook Git hooks configuration
# https://github.com/evilmartians/lefthook
#
# This repo hosts several independently-deployed services in sibling
# subfolders (ppr-ui, ppr-api, mhr-api). Each lint command is scoped to
# its own subfolder via `root:` so a commit touching only one service
# doesn't trigger checks for the others. secret-scan runs unscoped,
# across the whole staged changeset.

pre-commit:
  parallel: true
  commands:
    secret-scan:
      tags: security
      run: if [ ! -f .git/info/lefthook-remotes/bcregistry-sre-main/git-hooks/gitleaks-base.toml ]; then echo Shared gitleaks rules missing - run npx lefthook install; exit 1; fi; npx --yes gitleaks-secret-scanner

# Shared gitleaks rules: https://github.com/bcgov/bcregistry-sre/tree/main/git-hooks
remotes:
  - git_url: https://github.com/bcgov/bcregistry-sre
    ref: main
    refetch_frequency: 24h
    configs:
      - git-hooks/lefthook-remote.yml
